# Render blueprint: one Node web service serves the API and the built web app.
# Secrets use `sync: false`: set them in the Render dashboard, never in this file.
services:
  - type: web
    name: meshtab
    runtime: node
    # The free plan sleeps after 15 minutes idle (about 1 minute cold start for judges).
    # Use a paid instance from submission until the judging period ends.
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PAYPAL_MODE
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: DEMO_PAYOUT_RECEIVERS
        sync: false
      - key: GATEWAY_SECRET_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LLM_MODEL
        value: claude-opus-5-5
      - key: LLM_EFFORT
        value: low
      - key: LLM_RUNS_PER_DAY
        value: "300"
      - key: APPROVAL_LIMIT_CENTS
        value: "2500"
